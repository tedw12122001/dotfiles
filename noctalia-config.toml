[bar.default]
center = [ "workspaces" ]
end = [ "cpu", "network", "battery", "clock", "notifications", "tray" ]
start = [ "session", "control-center", "brightness", "bluetooth", "volume" ]
widget_spacing = 10

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 768.0
    cy = 778.0
    output = "eDP-1"
    placement_height = 960.0
    placement_width = 1536.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[theme]
builtin = "Ayu"
community_palette = "Aura"
mode = "dark"
source = "custom"
wallpaper_scheme = "dysfunctional"

[wallpaper]
directory = "/home/ted/dotfiles"
enabled = true

    [wallpaper.default]
    path = "/home/ted/dotfiles/Wallpaper.png"

    [wallpaper.last]
    path = "/home/ted/dotfiles/Wallpaper.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/ted/dotfiles/Wallpaper.png"

[widget.clock]
format = "%H:%M - %d/%m/%y "

[widget.cpu]
stat = "cpu_temp"

[widget.network]
show_label = false

[widget.volume]
show_label = false
